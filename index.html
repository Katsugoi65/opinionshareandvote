  const [formName, setFormName] = useState("");

  const [formTagInput, setFormTagInput] = useState("");

  const [adminAnnounceInput, setAdminAnnounceInput] = useState("");
  const [adminPollQuestion, setAdminPollQuestion] = useState("");
  const [adminPollOptions, setAdminPollOptions] = useState(["", ""]);

      localStorage.setItem("voicely_user_id", storedId);
    }
    setUserId(storedId);

    const savedTheme = localStorage.getItem("voicely_theme");
    if (savedTheme === "dark" || !savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      setIsDarkMode(true);
      document.documentElement.classList.add("dark");
    }
  }, []);

  const showToast = (message, type = "success") => {
    setToast({ message, type });
    setTimeout(() => setToast(null), 3000);
  };

  const toggleDarkMode = () => {
    if (isDarkMode) {
      document.documentElement.classList.remove("dark");

    if (db) {
      // --- [本物] Firebase Firestore 同期 ---

        const list = [];
        snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
        setPosts(list);
      });

      const unsubscribeAnnounce = db.collection("settings").doc("announcement").
      onSnapshot((doc) => {
        if (doc.exists) setAnnouncement(doc.data());else
        setAnnouncement(null);
      });

      const unsubscribePoll = db.collection("settings").doc("active_poll").
      onSnapshot((doc) => {
        if (doc.exists) setPoll(doc.data());else
        setPoll(null);
      });

      const unsubscribeLink = db.collection("settings").doc("custom_link").
      onSnapshot((doc) => {
        if (doc.exists) setCustomLink(doc.data());else
        setCustomLink(null);
      });

      const unsubscribeBan = db.collection("banned_users").
      onSnapshot((snapshot) => {
        const list = [];
        snapshot.forEach((doc) => list.push(doc.id));
        setBannedUsers(list);
      });

      return () => {
        unsubscribePosts();
        unsubscribeAnnounce();
        unsubscribePoll();
        unsubscribeLink();
        unsubscribeBan();
      };
    } else {
      // --- [デモ] ローカルストレージ ＆ シミュレータ ---
      const localPosts = localStorage.getItem("voicely_posts_v2");
      const localAnnounce = localStorage.getItem("voicely_announce_v2");
      const localPoll = localStorage.getItem("voicely_poll_v2");
      const localLink = localStorage.getItem("voicely_link_v2");
      const localBans = localStorage.getItem("voicely_bans_v2");

      if (localPosts) setPosts(JSON.parse(localPosts));else
      {
        setPosts(initialMockPosts);
        localStorage.setItem("voicely_posts_v2", JSON.stringify(initialMockPosts));
      }

      if (localAnnounce) setAnnouncement(JSON.parse(localAnnounce));else
      {
        setAnnouncement(initialMockAnnouncement);
        localStorage.setItem("voicely_announce_v2", JSON.stringify(initialMockAnnouncement));
      }

      if (localPoll) setPoll(JSON.parse(localPoll));else
      {
        setPoll(initialMockPoll);
        localStorage.setItem("voicely_poll_v2", JSON.stringify(initialMockPoll));
      }

      if (localLink) setCustomLink(JSON.parse(localLink));else

        localStorage.setItem("voicely_link_v2", JSON.stringify(initialMockLink));

      const postInterval = setInterval(() => {
        const randomName = mockNames[Math.floor(Math.random() * mockNames.length)];

          const randomOptionIdx = Math.floor(Math.random() * optionCount).toString();

      showToast("投稿しました ");

      return;

    if (!post) return;

    const hasLiked = post.likedBy && post.likedBy.includes(userId);

    if (db) {
      const postRef = db.collection("posts").doc(postId);
      try {
        if (hasLiked) {
          await postRef.update({
            likes: firebase.firestore.FieldValue.increment(-1),
            likedBy: firebase.firestore.FieldValue.arrayRemove(userId)
          });
        } else {
          await postRef.update({
            likes: firebase.firestore.FieldValue.increment(1),
            likedBy: firebase.firestore.FieldValue.arrayUnion(userId)
          });
        }
      } catch (e) {
        console.error(e);
      }
    } else {
      const updated = posts.map((p) => {
        if (p.id === postId) {
          const likedBy = p.likedBy || [];
          if (hasLiked) {
            return { ...p, likes: Math.max(0, p.likes - 1), likedBy: likedBy.filter((id) => id !== userId) };
          } else {
            return { ...p, likes: p.likes + 1, likedBy: [...likedBy, userId] };
          }
        }
        return p;
      });
      setPosts(updated);
      localStorage.setItem("voicely_posts_v2", JSON.stringify(updated));
    }
  };

  const handleVote = async (optionIndex) => {
    if (bannedUsers.includes(userId)) {
      showToast("アカウント制限中のため投票できません。", "error");
      return;
    }

    if (!poll || !poll.isActive) return;

          const sfDoc = await transaction.get(pollRef);

    if (db) {
      await db.collection("settings").doc("announcement").delete();
    } else {
      setAnnouncement(null);
      localStorage.removeItem("voicely_announce_v2");
    }
    setAdminAnnounceInput("");
    showToast("お知らせを削除しました");
  };

  const handleCreatePoll = async (e) => {
    e.preventDefault();
    if (!isAdminMode) return;

    const cleanOptions = adminPollOptions.map((o) => o.trim()).filter((o) => o.length > 0);
    if (!adminPollQuestion.trim() || cleanOptions.length < 2) {
      showToast("質問と2つ以上の選択肢を入力してください", "error");
      return;
    }

    cleanOptions.forEach((_, idx) => initialVotes[idx] = 0);

      id: "poll-" + Date.now(),
      question: adminPollQuestion.trim(),
      options: cleanOptions,
      votes: initialVotes,

    showToast("投票を終了しました");

    } else {

      localStorage.setItem("voicely_link_v2", JSON.stringify(data));

    if (!isAdminMode || !authorId) return;
    const isBanned = bannedUsers.includes(authorId);

    if (db) {
      if (isBanned) {
        await db.collection("banned_users").doc(authorId).delete();
      } else {

      }
    } else {
      let updatedBans;
      if (isBanned) {
        updatedBans = bannedUsers.filter((id) => id !== authorId);
      } else {
        updatedBans = [...bannedUsers, authorId];
      }
      setBannedUsers(updatedBans);
      localStorage.setItem("voicely_bans_v2", JSON.stringify(updatedBans));
    }
    showToast(isBanned ? "BANを解除しました" : "ユーザーをBANしました", isBanned ? "info" : "error");
  };
